# Publish LineageBench as a named public HF dataset
# (https://huggingface.co/datasets/AwaisAdilKhokhar/lineagebench).
#
# The benchmark's ground truth and the reference implementation's results are
# committed in benchmarks/, so this needs no Hub round-trip and no gated
# licenses: it re-verifies the ship gates offline from the committed cache,
# then packages and pushes the dataset. Runs on any change to the manifest,
# the results, or the packaging scripts, and on demand.
#
# Needs an HF_TOKEN repo secret with WRITE access (the dataset push).
name: lineagebench-release

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/lineagebench_pairs.json"
      - "benchmarks/lineagebench_results.json"
      - "scripts/export_lineagebench.py"
      - "scripts/lineagebench_card_template.md"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . huggingface_hub
      - name: Re-verify ship gates offline
        run: python benchmarks/real_lineagebench.py --no-fetch
      - name: Build and push dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/export_lineagebench.py --push
